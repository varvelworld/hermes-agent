# =============================================================================
# docker-compose.yml — All-in-one dev agent Docker workspace
#
# Usage:
#   cd dev-agent-docker/
#   cp .env.example .env && vim .env
#   mkdir -p ~/code/workspace
#   docker compose up -d --build
#   ssh -p 2222 root@localhost
# =============================================================================

services:
  dev-agent:
    build:
      context: ..
      dockerfile: dev-agent-docker/Dockerfile
    container_name: agent-dev
    hostname: agent-dev
    stdin_open: true
    tty: true

    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:4096:4096"

    volumes:
      - ${WORKSPACE_DIR:-~/code/workspace}:/workspace:cached
      - ~/.ssh/id_ed25519.pub:/tmp/host_pubkey:ro
      - agent-hermes-data:/root/.hermes
      - agent-opencode-data:/root/.opencode
      - agent-config-data:/root/.config
      - agent-local-share-data:/root/.local/share
      - agent-claude-data:/root/.claude
      - agent-lark-data:/root/.lark-cli
      - agent-ssh-data:/root/.ssh

    env_file:
      - .env

    environment:
      - HERMES_HOME=/root/.hermes
      - LARKSUITE_CLI_DATA_DIR=/root/.lark-cli/data
      - TERM=xterm-256color
      - http_proxy=http://host.docker.internal:${PROXY_PORT:-7890}
      - https_proxy=http://host.docker.internal:${PROXY_PORT:-7890}
      - HTTP_PROXY=http://host.docker.internal:${PROXY_PORT:-7890}
      - HTTPS_PROXY=http://host.docker.internal:${PROXY_PORT:-7890}
      - no_proxy=localhost,127.0.0.1

    working_dir: /workspace

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  agent-hermes-data:
  agent-opencode-data:
  agent-config-data:
  agent-local-share-data:
  agent-claude-data:
  agent-lark-data:
  agent-ssh-data:
